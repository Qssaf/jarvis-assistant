name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - name: Packages
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv -r requirements.txt pyflakes
          uv pip install --python .venv --no-deps openwakeword
      - name: Lint
        shell: bash
        run: .venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }} -m pyflakes *.py
      - name: Tests
        shell: bash
        run: .venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }} test_jarvis.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-helper/go.mod
          cache-dependency-path: whatsapp-helper/go.sum
      - name: WhatsApp helper (jarvis-wa)
        working-directory: whatsapp-helper
        run: go vet ./... && go test ./...

  android:  # (the app's unit tests: the handshake byte for byte against phone.py's vector, pairing links, the wake word)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: The wake word's models (openWakeWord's own: WakeTest runs the app's port against them)
        run: |
          mkdir -p "$RUNNER_TEMP/wake"
          for f in melspectrogram.onnx embedding_model.onnx hey_jarvis_v0.1.onnx; do
            curl -fsSL -o "$RUNNER_TEMP/wake/$f" "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/$f"
          done
          echo "WAKE_MODELS=$RUNNER_TEMP/wake" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
