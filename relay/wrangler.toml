# Your own Jarvis relay on Cloudflare's free plan: `npx wrangler login`, then `npx wrangler deploy` in this folder.
name = "jarvis-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]  # (SQLite-backed Durable Objects are the ones on the free plan)
